generated: '2026-08-13'
method: probed
source: https://webloyalty.co.uk/.well-known/oauth-protected-resource
name: Webloyalty MCP Server
status: live
deployment:
  mode: remote
  endpoint: https://webloyalty.co.uk/wp-json/mcp/mcp-oauth-server
  auth: oauth
  verified: probed
description: >-
  Webloyalty's UK site (webloyalty.co.uk) serves a live, OAuth-protected Model
  Context Protocol endpoint from inside its WordPress REST API. It is advertised
  by two real discovery documents on the same host — RFC 9728
  protected-resource metadata naming the resource, and RFC 8414
  authorization-server metadata naming the authorize/token/revoke endpoints —
  and the endpoint answers JSON-RPC over HTTP. This is an infrastructure surface
  the company deployed (the WordPress MCP adapter plus an MCP OAuth server), NOT
  a documented developer product: Webloyalty publishes no developer portal, no
  API reference, and no mention of MCP anywhere on its marketing site.
servers:
- id: mcp-oauth-server
  url: https://webloyalty.co.uk/wp-json/mcp/mcp-oauth-server
  transport: streamable-http
  methods:
  - POST
  - GET
  - DELETE
  auth: oauth2
  probe:
    method: tools/list
    http_status: 401
    body: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    fetched: '2026-08-13'
- id: mcp-adapter-default-server
  url: https://webloyalty.co.uk/wp-json/mcp/mcp-adapter-default-server
  transport: streamable-http
  methods:
  - POST
  - GET
  - DELETE
  auth: wordpress-application-password
  probe:
    method: tools/list
    http_status: 401
    body: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
    fetched: '2026-08-13'
