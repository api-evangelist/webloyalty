tools: []
tools_note: >-
  NOT RECORDED — tools/list returns HTTP 401 on both servers. The live tool set
  and its inputSchemas require an OAuth access token with the `mcp` scope, which
  we do not hold. No tool list is published anywhere else (no llms.txt, no docs),
  so nothing is derived here. An authenticated introspection would be needed to
  enumerate them.
related_surfaces:
- surface: WordPress REST API
  url: https://webloyalty.co.uk/wp-json/
  status: 200
  note: >-
    Route index is anonymous and lists 317 routes across 16 namespaces, including
    `mcp` and `wp-abilities/v1` (the WordPress Abilities API the MCP adapter
    exposes as tools). Every data route we probed (wp/v2/posts,
    wp-abilities/v1/abilities, wp-abilities/v1/categories) returns HTTP 401
    `rest_forbidden` — the REST API itself is locked down.
