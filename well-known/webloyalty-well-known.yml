source: live HTTP probes of webloyalty.com and webloyalty.co.uk
note: >-
  Webloyalty publishes no security.txt, api-catalog, ai-plugin or agent card. It
  DOES serve two real OAuth 2.0 discovery documents on webloyalty.co.uk, both
  scoped to a single "mcp" scope: RFC 8414 authorization-server metadata and RFC
  9728 protected-resource metadata pointing at an MCP endpoint hosted inside the
  site's WordPress REST API. The webloyalty.com host is a static locale splash
  page and 404s every well-known path with an Apache default error body. The
  webloyalty.co.uk 404s are WordPress soft-404s (HTTP 404 with the full themed
  HTML page) — recorded as misses, not as documents.
