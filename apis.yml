name: Webloyalty
description: >-
  Webloyalty is a customer-engagement and loyalty-marketing company that helps
  ecommerce and retail businesses build stronger, more profitable customer
  relationships. Its market-leading rewards platform delivers savings, cashback,
  and shopping benefits to consumers, typically presented after an online
  transaction, while generating incremental secondary revenue for the retail
  partner. Founded in 1999 and historically part of the Affinion Group, the
  company operates localized programs across the United States, United Kingdom,
  France, Ireland, Spain, the Netherlands, Switzerland, Turkey, and Mexico. This
  API Evangelist profile was surfaced as a portfolio company of Canaan Partners.
  Webloyalty markets a consumer rewards/membership product and a partner
  engagement platform, and is a brand of Tenerity (formerly Affinion Group). It
  publishes no developer portal, API reference or OpenAPI — its commercial
  integration is sold as "bespoke API solutions" through sales. Its only public
  programmable surfaces are an OAuth-protected Model Context Protocol endpoint
  served from the UK site's WordPress REST API, and a first-party React Native
  SDK for embedding Webloyalty campaign banners in partner apps.
